name: Feature Request
description: Propose new functionality or improvements.
title: "[Feature]: "

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem or unmet need.
      placeholder: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the desired functionality.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative approaches.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Include relevant examples, references, or supporting information.