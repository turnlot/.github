name: Bug Report
description: Report incorrect or unexpected behavior.
title: "[Bug]: "

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the issue.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the steps needed to reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Include relevant logs, screenshots, or environment details. Do not include credentials or sensitive customer data.
    validations:
      required: false