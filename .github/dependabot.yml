# Dependabot opens pull requests for outdated dependencies, once a week,
# with one pull request per kind of dependency so the updates arrive
# together. Security fixes arrive as soon as they are known, apart from
# this schedule. Actions are pinned to commits; Dependabot moves the pin
# and the version in the comment beside it.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      github_actions:
        patterns: ["*"]
