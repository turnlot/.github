# Shared CI for TurnLot Python repositories.
#
# Call it from a repository's .github/workflows/ci.yml:
#
#   name: CI
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
#
#   permissions:
#     contents: read
#     id-token: write   # required: the called workflow requests it for CodeArtifact
#
#   jobs:
#     ci:
#       uses: turnlot/.github/.github/workflows/python-ci.yml@main
#       with:
#         ruff-version: "0.17.2"
#         postgres: true
#         codeartifact: true
#         codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
#         codeartifact-role-arn: ${{ vars.CODEARTIFACT_READ_ROLE_ARN }}
#
# This repository is public, so account IDs and role ARNs are passed in from
# the calling repository's variables rather than written here.

name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test with.
        type: string
        default: "3.14"
      ruff-version:
        description: Ruff version; must match the dev dependency pin in pyproject.toml.
        type: string
        required: true
      mypy:
        description: Run mypy.
        type: boolean
        default: true
      postgres:
        description: Start PostgreSQL and set TEST_DATABASE_URL for tests.
        type: boolean
        default: false
      postgres-image:
        description: PostgreSQL container image.
        type: string
        default: postgres:17
      codeartifact:
        description: Authenticate pip to AWS CodeArtifact before installing dependencies.
        type: boolean
        default: false
      codeartifact-domain:
        type: string
        default: turnlot
      codeartifact-repository:
        type: string
        default: python
      codeartifact-region:
        type: string
        default: us-east-2
      codeartifact-domain-owner:
        description: AWS account ID that owns the CodeArtifact domain.
        type: string
        default: ""
      codeartifact-role-arn:
        description: IAM role assumed through OIDC to read from CodeArtifact.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # ===================
  # ----- Linting -----
  # ===================

  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Ruff
        run: python -m pip install "ruff==${{ inputs.ruff-version }}"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  # ===========================
  # ----- Types and Tests -----
  # ===========================

  test:
    name: Mypy and Pytest
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      TEST_DATABASE_URL: ${{ inputs.postgres && 'postgresql+psycopg://turnlot:turnlot@127.0.0.1:5432/turnlot_test' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # --- PostgreSQL ---

      - name: Start PostgreSQL
        if: inputs.postgres
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=turnlot \
            -e POSTGRES_PASSWORD=turnlot \
            -e POSTGRES_DB=turnlot_test \
            -p 5432:5432 \
            "${{ inputs.postgres-image }}"

          for _ in $(seq 1 30); do
            if docker exec postgres pg_isready -U turnlot -d turnlot_test; then
              exit 0
            fi
            sleep 2
          done

          echo "PostgreSQL did not become ready" >&2
          exit 1

      # --- AWS CodeArtifact ---

      - name: Check CodeArtifact inputs
        if: inputs.codeartifact
        env:
          DOMAIN_OWNER: ${{ inputs.codeartifact-domain-owner }}
          ROLE_ARN: ${{ inputs.codeartifact-role-arn }}
        run: |
          if [ -z "$DOMAIN_OWNER" ] || [ -z "$ROLE_ARN" ]; then
            echo "codeartifact-domain-owner and codeartifact-role-arn are required when codeartifact is true" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        if: inputs.codeartifact
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ inputs.codeartifact-role-arn }}
          aws-region: ${{ inputs.codeartifact-region }}

      - name: Authenticate to CodeArtifact
        if: inputs.codeartifact
        env:
          DOMAIN: ${{ inputs.codeartifact-domain }}
          DOMAIN_OWNER: ${{ inputs.codeartifact-domain-owner }}
          REPOSITORY: ${{ inputs.codeartifact-repository }}
          REGION: ${{ inputs.codeartifact-region }}
        run: |
          aws codeartifact login \
            --tool pip \
            --domain "$DOMAIN" \
            --domain-owner "$DOMAIN_OWNER" \
            --repository "$REPOSITORY" \
            --region "$REGION"

      # --- Checks ---

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check types
        if: inputs.mypy
        run: mypy

      - name: Run tests
        run: pytest -v
